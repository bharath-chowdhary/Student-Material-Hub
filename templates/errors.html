{% load static%}
<!doctype html>
<html lang="en">
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'style.css' %}" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="header">
      <div class="h_content">
        <div class="box">
          <img
            src="{% static './QISCET_logo_transparent.png' %}"
            width="130px"
          />
        </div>
        <div class="box">
          <h1>QIS College of Engineering And Technology</h1>
        </div>
        <h2>Student Material Hub</h2>
      </div>
    </div>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Material's Portal</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href=""
                >Sections</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true"
                >Unit Materials</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="{% url 'register'%}"
                >Register</a
              >
            </li>
          </ul>
          <form class="d-flex" role="search" method="get">
            {% csrf_token %}
            <input type="hidden" class="hide" value="sch" name="type" />
            <input
              class="form-control me-2"
              type="search"
              placeholder="section: CSDS-1"
              name="name"
              aria-label="Search"
            />
            <input
              class="form-control me-2"
              type="search"
              placeholder="batch: 2023"
              name="batch"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>

    <div align="center">
      <h3>Errors:</h3>
      {% if errors %}
      <h6>{{errors}}</h6>
      {% endif %}
      <a href="{% url 'sections'%}"
        ><button class="btn bg-danger">Back</button></a
      >
    </div>
  </body>
</html>
